name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-windows:
    name: Build single-file EXE (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build single-file EXE with PyInstaller
        run: uv run pyinstaller --noconfirm --onefile --windowed --name "2icon" --icon "logo.ico" --add-data "logo.ico;." --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32com --collect-data tkinterdnd2 --collect-data customtkinter main.py

      - name: Verify artifact
        run: |
          if (!(Test-Path "dist/2icon.exe")) { Write-Error "dist/2icon.exe not found"; exit 1 }
          Get-Item "dist/2icon.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2icon-windows-x64
          path: dist/2icon.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/2icon.exe
          overwrite_files: true
          generate_release_notes: true
